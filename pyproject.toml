[project]
name = "osascript-mcp"
version = "2.0.0"
authors = [
    { name = "pythoninthegrass" }
]

requires-python = ">=3.13,<3.14"

dependencies = [
    "mcp>=1.7.1",
    "toon-format==0.9.0b1",
]

[project.scripts]
osascript-mcp = "osascript_mcp.server:main"

[dependency-groups]
bench = [
    "anthropic>=1.8.0",
    "tiktoken>=0.14.0",
]
dev = [
    "hypothesis>=6.138.3",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osascript_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
asyncio_mode = "auto"
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]
addopts = [
    "--strict-markers",
    "--strict-config"
]
