name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # macOS only: the integration suite drives real windows, menus, the
    # clipboard and screencapture.
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml pins requires-python to >=3.13,<3.14 (Lance's call
        # during the uv scaffold), so 3.12 isn't installable here.
        python: ["3.13"]

    name: python ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run unit tests
        run: uv run pytest -m unit -n auto

      - name: Run integration tests
        run: uv run pytest -m integration
        env:
          LANG: en_US.UTF-8
